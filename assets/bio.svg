<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="620" height="180">
  <defs>
    <!-- Glowing cyan filter -->
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Glowing pink filter -->
    <filter id="neon-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');

    .bio-text {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      fill: #e1e7f0;
    }

    .bio-highlight {
      font-weight: bold;
      fill: #00f2fe;
    }

    .bio-accent {
      font-weight: bold;
      fill: #ff007f;
    }

    /* Staggered slide and fade animations with static fallback */
    @keyframes slide-fade {
      0% {
        opacity: 0;
        transform: translateX(-20px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .bio-row {
      opacity: 1; /* Default is visible when static */
      animation: slide-fade 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .row-1 { animation-delay: 0.3s; }
    .row-2 { animation-delay: 0.7s; }
    .row-3 { animation-delay: 1.1s; }
    .row-4 { animation-delay: 1.5s; }
    .row-5 { animation-delay: 1.9s; }
  </style>

  <!-- Panel Background to ensure readability on both light & dark themes -->
  <rect x="2" y="2" width="616" height="176" rx="8" fill="#080b10" stroke="#30363d" stroke-width="1.5" />

  <!-- Corner Brackets to match cards -->
  <path d="M 12 8 H 8 V 12" stroke="#ff007f" stroke-width="1.5" fill="none" />
  <path d="M 608 8 H 612 V 12" stroke="#00f2fe" stroke-width="1.5" fill="none" filter="url(#neon-cyan)" />
  <path d="M 8 168 V 172 H 12" stroke="#00f2fe" stroke-width="1.5" fill="none" filter="url(#neon-cyan)" />
  <path d="M 612 168 V 172 H 608" stroke="#ff007f" stroke-width="1.5" fill="none" />

  <!-- Row 1: College Student -->
  <g transform="translate(15, 30)">
    <g class="bio-row row-1">
      <circle cx="5" cy="0" r="3.5" fill="#00f2fe" filter="url(#neon-cyan)" />
      <text x="25" y="4" class="bio-text">🎓 College student focused on <tspan class="bio-highlight">Computer Science, Physics &amp; Math</tspan></text>
    </g>
  </g>

  <!-- Row 2: Dev Stack -->
  <g transform="translate(15, 62)">
    <g class="bio-row row-2">
      <circle cx="5" cy="0" r="3.5" fill="#ff007f" filter="url(#neon-pink)" />
      <text x="25" y="4" class="bio-text">💻 Works daily with <tspan class="bio-accent">Python, C, JavaScript, Kotlin &amp; Linux</tspan></text>
    </g>
  </g>

  <!-- Row 3: Building Vision -->
  <g transform="translate(15, 94)">
    <g class="bio-row row-3">
      <circle cx="5" cy="0" r="3.5" fill="#00f2fe" filter="url(#neon-cyan)" />
      <text x="25" y="4" class="bio-text">🤖 Building automation pipelines &amp; <tspan class="bio-highlight">YOLO computer vision models</tspan></text>
    </g>
  </g>

  <!-- Row 4: Linux Arch -->
  <g transform="translate(15, 126)">
    <g class="bio-row row-4">
      <circle cx="5" cy="0" r="3.5" fill="#ff007f" filter="url(#neon-pink)" />
      <text x="25" y="4" class="bio-text">🐧 Linux/Arch enthusiast — <tspan class="bio-accent">system customization &amp; shell tweaking</tspan></text>
    </g>
  </g>

  <!-- Row 5: Curiosity systems -->
  <g transform="translate(15, 158)">
    <g class="bio-row row-5">
      <circle cx="5" cy="0" r="3.5" fill="#00f2fe" filter="url(#neon-cyan)" />
      <text x="25" y="4" class="bio-text">🧠 Always curious about how things work, from <tspan class="bio-highlight">kernel to futuristic UI</tspan></text>
    </g>
  </g>
</svg>
