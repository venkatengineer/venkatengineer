<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="450" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b10" />
      <stop offset="100%" stop-color="#0c0e15" />
    </linearGradient>

    <!-- Gradients for gauges -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39f3bb" />
      <stop offset="100%" stop-color="#27c93f" />
    </linearGradient>
    <linearGradient id="neon-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffbd2e" />
      <stop offset="100%" stop-color="#f3a539" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');
    
    .stats-title {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #00f2fe;
      letter-spacing: 1px;
    }

    .stats-label {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      fill: #8b949e;
    }

    .stats-number {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      fill: #f0f6fc;
      font-weight: bold;
    }

    .hud-gauge-text {
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      fill: #00f2fe;
      text-anchor: middle;
      font-weight: bold;
    }

    /* Keyframes */
    @keyframes load-bar {
      from { stroke-dashoffset: 140; }
    }
    @keyframes rotate-gauge {
      to { transform: rotate(360deg); }
    }
    @keyframes fade-in-specs {
      to { opacity: 1; }
    }

    /* Applications */
    .animated-bar-cyan {
      animation: load-bar 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: 0.3s;
    }
    .animated-bar-pink {
      animation: load-bar 1.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: 0.5s;
    }
    .animated-bar-yellow {
      animation: load-bar 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: 0.4s;
    }
    .animated-bar-green {
      animation: load-bar 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: 0.6s;
    }

    .gauge-ring {
      transform-origin: 70px 105px;
      animation: rotate-gauge 12s linear infinite;
    }
  </style>

  <!-- Panel Background -->
  <rect x="2" y="2" width="446" height="196" rx="8" fill="url(#panel-bg)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Left Side: Circular HUD Gauge -->
  <g transform="translate(0, 0)">
    <!-- Outer static track -->
    <circle cx="70" cy="105" r="45" fill="none" stroke="#161b22" stroke-width="1" />
    
    <!-- Rotating tech ring -->
    <circle cx="70" cy="105" r="45" fill="none" stroke="url(#neon-cyan)" stroke-width="2.5" stroke-dasharray="140 100" class="gauge-ring" filter="url(#cyan-glow)" />
    
    <!-- Inner static circle -->
    <circle cx="70" cy="105" r="34" fill="#0c0f17" stroke="#1f293d" stroke-width="1" />
    
    <!-- Center text -->
    <text x="70" y="103" class="hud-gauge-text">GIT</text>
    <text x="70" y="114" class="hud-gauge-text" fill="#ff007f">CORE</text>
  </g>

  <!-- Divider -->
  <line x1="140" y1="20" x2="140" y2="180" stroke="#00f2fe" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Panel Header Title -->
  <text x="160" y="32" class="stats-title">MAINFRAME // GENERAL_STATS</text>

  <!-- Stat Row 1: Commits -->
  <g transform="translate(160, 60)">
    <text x="0" y="0" class="stats-label">TOTAL_COMMITS</text>
    <text x="250" y="0" class="stats-number" text-anchor="end">151</text>
    <!-- Bar Track -->
    <line x1="0" y1="8" x2="250" y2="8" stroke="#161b22" stroke-width="4" stroke-linecap="round" />
    <!-- Bar Fill -->
    <line x1="0" y1="8" x2="250" y2="8" stroke="url(#neon-cyan)" stroke-width="4" stroke-linecap="round" stroke-dasharray="250" stroke-dashoffset="61" class="animated-bar-cyan" filter="url(#cyan-glow)" />
  </g>

  <!-- Stat Row 2: Pull Requests -->
  <g transform="translate(160, 95)">
    <text x="0" y="0" class="stats-label">PULL_REQUESTS</text>
    <text x="250" y="0" class="stats-number" text-anchor="end">0</text>
    <!-- Bar Track -->
    <line x1="0" y1="8" x2="250" y2="8" stroke="#161b22" stroke-width="4" stroke-linecap="round" />
    <!-- Bar Fill -->
    <line x1="0" y1="8" x2="250" y2="8" stroke="url(#neon-pink)" stroke-width="4" stroke-linecap="round" stroke-dasharray="250" stroke-dashoffset="250" class="animated-bar-pink" filter="url(#pink-glow)" />
  </g>

  <!-- Stat Row 3: Issues Closed -->
  <g transform="translate(160, 130)">
    <text x="0" y="0" class="stats-label">ISSUES_CLOSED</text>
    <text x="250" y="0" class="stats-number" text-anchor="end">0</text>
    <!-- Bar Track -->
    <line x1="0" y1="8" x2="250" y2="8" stroke="#161b22" stroke-width="4" stroke-linecap="round" />
    <!-- Bar Fill -->
    <line x1="0" y1="8" x2="250" y2="8" stroke="url(#neon-yellow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="250" stroke-dashoffset="250" class="animated-bar-yellow" />
  </g>

  <!-- Stat Row 4: Total Stars -->
  <g transform="translate(160, 165)">
    <text x="0" y="0" class="stats-label">PROJECT_STARS</text>
    <text x="250" y="0" class="stats-number" text-anchor="end">2</text>
    <!-- Bar Track -->
    <line x1="0" y1="8" x2="250" y2="8" stroke="#161b22" stroke-width="4" stroke-linecap="round" />
    <!-- Bar Fill -->
    <line x1="0" y1="8" x2="250" y2="8" stroke="url(#neon-green)" stroke-width="4" stroke-linecap="round" stroke-dasharray="250" stroke-dashoffset="150" class="animated-bar-green" />
  </g>

  <!-- Corner Brackets -->
  <path d="M 12 6 H 6 V 12" stroke="#ff007f" stroke-width="1.5" fill="none" />
  <path d="M 438 6 H 444 V 12" stroke="#00f2fe" stroke-width="1.5" fill="none" filter="url(#cyan-glow)" />
  <path d="M 6 188 V 194 H 12" stroke="#00f2fe" stroke-width="1.5" fill="none" filter="url(#cyan-glow)" />
  <path d="M 444 188 V 194 H 438" stroke="#ff007f" stroke-width="1.5" fill="none" />
</svg>
