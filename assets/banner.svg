<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <defs>
    <!-- Background grid pattern with scroll animation -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#121826" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0,0; 0,40" dur="3s" repeatCount="indefinite" />
    </pattern>

    <!-- Radial gradient for grid fade -->
    <radialGradient id="grid-fade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#04060a" stop-opacity="0" />
      <stop offset="100%" stop-color="#04060a" stop-opacity="0.9" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="terminal-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="hud-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Typing Animations Clip Paths (Absolute coordinates) -->
    <clipPath id="clip-cmd1">
      <rect id="rect-cmd1" x="450" y="80" width="0" height="25" />
    </clipPath>
    <clipPath id="clip-cmd2">
      <rect id="rect-cmd2" x="450" y="130" width="0" height="25" />
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');

    .term-font {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      fill: #f0f6fc;
    }

    /* Keyframes for Extravagant Animations */
    @keyframes type-cmd1 {
      to { width: 55px; }
    }
    @keyframes type-cmd2 {
      to { width: 170px; }
    }
    @keyframes move-cursor1 {
      from { x: 210px; }
      to { x: 265px; }
    }
    @keyframes move-cursor2 {
      from { x: 210px; }
      to { x: 380px; }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    @keyframes fade-in {
      to { opacity: 1; }
    }
    @keyframes fade-out {
      to { opacity: 0; }
    }
    @keyframes pulse-core {
      0% { transform: scale(0.9) translate(110px, 170px); opacity: 0.6; }
      50% { transform: scale(1.1) translate(100px, 154px); opacity: 1; }
      100% { transform: scale(0.9) translate(110px, 170px); opacity: 0.6; }
    }

    /* Animation Timing */
    #rect-cmd1 {
      animation: type-cmd1 0.8s steps(6) forwards;
      animation-delay: 0.5s;
    }
    #cursor-1 {
      animation: move-cursor1 0.8s steps(6) forwards, blink 0.7s step-end infinite;
      animation-delay: 0.5s;
    }
    #cursor-1-group {
      animation: fade-out 0.1s forwards;
      animation-delay: 1.5s;
    }
    #output-1 {
      opacity: 0;
      animation: fade-in 0.3s forwards;
      animation-delay: 1.5s;
    }
    
    #line-2-group {
      opacity: 0;
      animation: fade-in 0.1s forwards;
      animation-delay: 1.8s;
    }
    #rect-cmd2 {
      animation: type-cmd2 1.2s steps(20) forwards;
      animation-delay: 2.0s;
    }
    #cursor-2 {
      animation: move-cursor2 1.2s steps(20) forwards, blink 0.7s step-end infinite;
      animation-delay: 2.0s;
    }
    
    #sys-specs {
      opacity: 0;
      animation: fade-in 0.5s forwards;
      animation-delay: 3.5s;
    }

    .pulse-core-circle {
      transform-origin: center;
      animation: pulse-core 3s infinite ease-in-out;
    }
  </style>

  <!-- Deep space background -->
  <rect width="800" height="340" fill="#04060a" />

  <!-- Animated Scrolling Cybergrid -->
  <rect width="800" height="340" fill="url(#cyber-grid)" />
  <rect width="800" height="340" fill="url(#grid-fade)" />

  <!-- Falling Matrix Binary Streams -->
  <g font-family="monospace" font-size="9" fill="#00f2fe" opacity="0.15">
    <text x="20" y="-100" writing-mode="vertical-rl">101100101011010110010110101001010<animate attributeName="y" values="-180;340" dur="7s" repeatCount="indefinite" /></text>
    <text x="185" y="-100" writing-mode="vertical-rl">011010011001010100110101011010011<animate attributeName="y" values="-150;340" dur="5s" repeatCount="indefinite" /></text>
    <text x="200" y="-100" writing-mode="vertical-rl">100110100101011010010100110101101<animate attributeName="y" values="-200;340" dur="9s" repeatCount="indefinite" /></text>
    <text x="775" y="-100" writing-mode="vertical-rl">010011010110100101011010010110011<animate attributeName="y" values="-120;340" dur="6s" repeatCount="indefinite" /></text>
  </g>

  <!-- LEFT SIDE: Extravagant HUD Reactor -->
  <g id="hud-system" transform="translate(0, 0)">
    <!-- Tech lines/decorations -->
    <line x1="20" y1="170" x2="200" y2="170" stroke="#1f293d" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="110" y1="50" x2="110" y2="290" stroke="#1f293d" stroke-width="1" stroke-dasharray="4 4" />
    
    <!-- Outer bracket rings (Spinning clockwise) -->
    <circle cx="110" cy="170" r="75" fill="none" stroke="url(#hud-ring-grad)" stroke-width="1" stroke-dasharray="80 160" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 110 170" to="360 110 170" dur="15s" repeatCount="indefinite" />
    </circle>

    <!-- Middle Dashboard Ring (Spinning counter-clockwise) -->
    <circle cx="110" cy="170" r="62" fill="none" stroke="#ff007f" stroke-width="2" stroke-dasharray="40 10 5 10" filter="url(#neon-pink)" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360 110 170" to="0 110 170" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Dashboard Ring (Spinning clockwise) -->
    <circle cx="110" cy="170" r="48" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="15 5 15 15" filter="url(#neon-cyan)" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 110 170" to="360 110 170" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- Pulsing HUD Core -->
    <circle cx="110" cy="170" r="10" fill="url(#hud-ring-grad)" filter="url(#neon-cyan)" class="pulse-core-circle" />
    
    <!-- HUD Crosshairs -->
    <path d="M 100 170 H 120 M 110 160 V 180" stroke="#04060a" stroke-width="1.5" />
    
    <!-- Text Labels inside HUD -->
    <text x="110" y="270" font-family="'Fira Code', monospace" font-size="9" fill="#00f2fe" text-anchor="middle" font-weight="bold" letter-spacing="1">SYS_CORE: ACTIVE</text>
  </g>

  <!-- RIGHT SIDE: Cyber Terminal Window -->
  <g transform="translate(220, 25)">
    <!-- Terminal shadow and backdrop -->
    <rect x="0" y="0" width="555" height="290" rx="10" fill="#060913" opacity="0.95" stroke="url(#terminal-border)" stroke-width="2" />
    
    <!-- Terminal top bar -->
    <path d="M 0 10 A 10 10 0 0 1 10 0 H 545 A 10 10 0 0 1 555 10 V 28 H 0 Z" fill="#0d111d" />
    
    <!-- Window buttons -->
    <circle cx="20" cy="14" r="5" fill="#ff5f56" />
    <circle cx="35" cy="14" r="5" fill="#ffbd2e" />
    <circle cx="50" cy="14" r="5" fill="#27c93f" />
    
    <!-- Window Title -->
    <text x="277" y="18" font-family="'Fira Code', monospace" font-size="11" fill="#8b949e" text-anchor="middle">venkat@arch-mainframe:~</text>
    
    <!-- Terminal Lines -->
    <g class="term-font" transform="translate(20, 25)">
      <!-- Line 1: whoami -->
      <g transform="translate(0, 30)">
        <text x="0" y="0" fill="#39f3bb" font-weight="bold">venkat@arch-mainframe:~$</text>
        <text x="210" y="0" fill="#ffffff" clip-path="url(#clip-cmd1)">whoami</text>
        
        <!-- Blinking cursor 1 -->
        <g id="cursor-1-group">
          <rect id="cursor-1" x="210" y="-12" width="8" height="15" fill="#00f2fe" />
        </g>
      </g>

      <!-- Line 1 Output: developer/designer -->
      <g id="output-1" transform="translate(0, 55)">
        <text x="0" y="0" fill="#8b949e">&gt;&gt; Venkat Badhrinarayanan PV (Developer &amp; Tech Enthusiast)</text>
      </g>

      <!-- Line 2: neofetch -->
      <g id="line-2-group" transform="translate(0, 80)">
        <text x="0" y="0" fill="#39f3bb" font-weight="bold">venkat@arch-mainframe:~$</text>
        <text x="210" y="0" fill="#ffffff" clip-path="url(#clip-cmd2)">neofetch --mainframe</text>
        <rect id="cursor-2" x="210" y="-12" width="8" height="15" fill="#ff007f" />
      </g>

      <!-- System specs block (fades in) -->
      <g id="sys-specs" transform="translate(0, 105)">
        <!-- Horizontal separator -->
        <line x1="0" y1="0" x2="515" y2="0" stroke="#1f293d" stroke-width="1" />
        
        <g transform="translate(10, 25)">
          <text x="0" y="0" fill="#ff007f" font-weight="bold">OS</text>
          <text x="100" y="0" fill="#f0f6fc">: Arch Linux x86_64</text>

          <text x="0" y="20" fill="#ff007f" font-weight="bold">SHELL</text>
          <text x="100" y="20" fill="#f0f6fc">: zsh / custom-cyber</text>

          <text x="0" y="40" fill="#ff007f" font-weight="bold">CORES</text>
          <text x="100" y="40" fill="#f0f6fc">: Python / C / JavaScript / Kotlin / Linux</text>

          <text x="0" y="60" fill="#ff007f" font-weight="bold">MOTTO</text>
          <text x="100" y="60" fill="#00f2fe" font-weight="bold">: ⚡ Curiosity drives innovation.</text>
          
          <!-- System colors indicators -->
          <g transform="translate(0, 85)">
            <text x="0" y="10" fill="#8b949e" font-size="11">MAINFRAME_THEME:</text>
            <rect x="135" y="0" width="20" height="12" fill="#060913" stroke="#1f293d" />
            <rect x="160" y="0" width="20" height="12" fill="#ff5f56" />
            <rect x="185" y="0" width="20" height="12" fill="#27c93f" />
            <rect x="210" y="0" width="20" height="12" fill="#ffbd2e" />
            <rect x="235" y="0" width="20" height="12" fill="#00f2fe" />
            <rect x="260" y="0" width="20" height="12" fill="#7f00ff" />
            <rect x="285" y="0" width="20" height="12" fill="#ff007f" />
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
