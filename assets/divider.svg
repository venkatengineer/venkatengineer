<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 12" width="800" height="12">
  <defs>
    <!-- Linear gradient for the line -->
    <linearGradient id="glow-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="50%" stop-color="#7f00ff" stop-opacity="1" />
      <stop offset="75%" stop-color="#ff007f" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="neon-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Horizontal divider line -->
  <line x1="0" y1="6" x2="800" y2="6" stroke="url(#glow-line-grad)" stroke-width="2" filter="url(#neon-glow)" />

  <!-- Center tech detail: Pulsing Diamond -->
  <g transform="translate(400, 6)">
    <!-- Rotating cyan square -->
    <rect x="-4" y="-4" width="8" height="8" fill="#00f2fe" filter="url(#neon-glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </rect>
    <!-- Inner glowing pink core -->
    <circle cx="0" cy="0" r="2.5" fill="#ff007f">
      <animate attributeName="r" values="2;3.5;2" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
